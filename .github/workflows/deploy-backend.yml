# CD: deploy the backend to AWS when backend code changes on main (or on demand).
# Runs the full CI first; deploys only if it passes. AWS access uses GitHub's OIDC token
# to assume a deploy role (see backend/deploy/create-github-role.sh): no AWS keys in GitHub.
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys of the stack at once; a newer push waits for the current deploy.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to AWS
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # lets the job request an OIDC token for AWS
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy stack and code
        run: ./deploy/deploy.sh
        env:
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          RESEND_TO_EMAIL: ${{ vars.RESEND_TO_EMAIL }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Smoke test the live API
        run: |
          url=$(aws cloudformation describe-stacks --stack-name portfolio-backend \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          for attempt in 1 2 3 4 5; do
            if curl -fsS "${url}api/health" | grep -q '"ok":true'; then
              echo "Live API healthy: ${url}api/health"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Live API health check failed"
          exit 1
