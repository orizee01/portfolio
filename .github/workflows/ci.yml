# CI: build the frontend and test the backend on every pull request and push to main.
# The frontend is deployed by Vercel's GitHub integration; the backend by deploy-backend.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # same as the Lambda runtime
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Production dependencies have no known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both images and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Smoke test through nginx
        run: |
          set -e
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/admin | grep -q '<div id="root">'   # SPA fallback
          curl -fsS http://localhost:8080/api/health | grep -q '"ok":true'   # proxied to the backend
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/contact \
            -H 'Content-Type: application/json' -d '{"name":"CI","email":"not-an-email","message":"hi"}')
          test "$status" = 400                                               # backend validation via proxy
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/messages)
          test "$status" = 503                                               # no admin configured in CI
          docker compose exec -T backend sh -c 'test "$(id -u)" != 0'          # backend is not root
          echo "Docker stack OK"
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  infrastructure:
    name: CloudFormation lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint
      # Errors fail the build; style warnings are reported but do not.
      - run: cfn-lint --non-zero-exit-code error backend/deploy/template.yaml
