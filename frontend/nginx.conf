# Serves the built site and forwards API calls to the backend container ("backend" in compose).
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m; # images are limited to 5MB by the backend
    }

    # Images uploaded to the backend's local storage.
    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
    }

    # Built assets have content hashes in their names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths (/admin, /messages, …) load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
